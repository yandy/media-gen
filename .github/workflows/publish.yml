name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # trusted publishing: this OIDC token is the only credential

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      # One package, one version: a Release cut from a commit whose package.json
      # still says 0.1.0 would publish the wrong number under the right tag.
      - name: Verify the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::release tag $TAG does not match package.json version v$VERSION"
            exit 1
          fi
      - run: npm ci
      # A Release tag can point at any commit, including one that never ran CI.
      - run: npm test
      - run: npm publish --provenance
